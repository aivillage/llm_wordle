version: '2'

services:
  llm_wordle:
    build:
      context: ../
      dockerfile: dockerfiles/Dockerfile.dev
    user: root
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - ../.data/llm_wordle/logs:/var/log/llm_wordle
      - ../:/opt/llm_wordle:ro
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      llm_router:
        condition: service_healthy
    networks:
        default:
        internal:
    env_file:
      - ../.env_dev

  llm_router:
    image: aivillage/llm_router:dev
    user: root
    restart: always
    volumes:
      - ../mock.json:/opt/models/chat/mock.json
    environment:
      - REDIS_URL=redis://cache:6379
    depends_on:
      - cache
    networks:
        internal:
    healthcheck:
      test: ["CMD", "curl","-f","http://localhost:8000/health"]
      start_period: 1s
      interval: 5s
      timeout: 5s
      retries: 55

  db:
    image: postgres:15
    restart: always
    environment:
      - POSTGRES_USER=llm_wordle
      - POSTGRES_PASSWORD=llm_wordle
      - POSTGRES_DB=llm_wordle
    volumes:
      - ../.data/postgres:/var/lib/postgres
    networks:
        internal:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 55

  cache:
    image: redis:4
    restart: always
    volumes:
    - ../.data/redis:/data
    networks:
        internal:
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 55

networks:
    default:
    internal:
        internal: true

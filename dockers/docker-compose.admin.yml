version: '2'

services:
  llm_wordle_admin:
    env_file:
      - ../.env
    build:
      context: ../
      dockerfile: dockers/Dockerfile.admin
    user: root
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      cache:
        condition: service_healthy
    networks:
        default:
        internal:

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ../nginx/http.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - llm_wordle_admin

  cache:
    image: redis:4
    restart: always
    volumes:
    - ../.data/redis:/data
    networks:
        internal:
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 55

networks:
    default:
    internal:
        internal: true
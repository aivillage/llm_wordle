version: '2'

services:
  llm_wordle:
    env_file:
      - ../.env
    build:
      context: ../
      dockerfile: dockers/Dockerfile.admin
    user: root
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      cache:
        condition: service_healthy
    networks:
        default:
        internal:

  caddy:
    image: caddy:2.6.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../Caddyfile.admin:/etc/caddy/Caddyfile
      - ../.data/caddy/data:/data
      - ../.data/caddy/config:/config

  cache:
    image: redis:4
    restart: always
    volumes:
    - ../.data/redis:/data
    networks:
        internal:
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      start_period: 5s
      interval: 5s
      timeout: 5s
      retries: 55

networks:
    default:
    internal:
        internal: true
version: 1
disable_existing_loggers: False
formatters:
  default:
    "()": uvicorn.logging.DefaultFormatter
    format: '[%(asctime)s] %(levelname)s %(message)s'
  access:
    "()": uvicorn.logging.AccessFormatter
    format: "[%(asctime)s %(process)d] %(name)s - %(levelname)s - %(message)s | %(filename)s:%(lineno)d"
  app_format:
    format: "[%(asctime)s %(process)d] %(name)s - %(levelname)s - %(message)s | %(filename)s:%(lineno)d"
handlers:
  gunicorn.error:
    class: logging.StreamHandler
    formatter: default
    level: INFO
    stream: ext://sys.stderr
  gunicorn.access:
    class: logging.StreamHandler
    formatter: access
    level: INFO
    stream: ext://sys.stdout
  gunicorn.error_file:
    class: logging.FileHandler
    formatter: default
    level: INFO
    filename: /var/log/llm_wordle/gunicorn_errors.log
    encoding: utf8
    mode: a
  gunicorn.access_file:
    class: logging.FileHandler
    formatter: access
    level: INFO
    filename: /var/log/llm_wordle/gunicorn_access.log
    encoding: utf8
    mode: a

  file_handler:
    class: logging.FileHandler
    level: INFO
    formatter: app_format
    filename: /var/log/llm_wordle/info.log
    encoding: utf8
    mode: a
  gen_file_handler:
    class: logging.FileHandler
    level: INFO
    formatter: app_format
    filename: /var/log/llm_wordle/generations.log
    encoding: utf8
    mode: a
  public_file_handler:
    class: logging.FileHandler
    level: INFO
    formatter: app_format
    filename: /var/log/llm_wordle/public.log
    encoding: utf8
    mode: a
  admin_file_handler:
    class: logging.FileHandler
    level: INFO
    formatter: app_format
    filename: /var/log/llm_wordle/admin.log
    encoding: utf8
    mode: a
  auth_file_handler:
    class: logging.FileHandler
    level: INFO
    formatter: app_format
    filename: /var/log/llm_wordle/auth.log
    encoding: utf8
    mode: a
  app_default:
    formatter: app_format
    class: logging.StreamHandler
    stream: ext://sys.stderr

  default:
    formatter: default
    class: logging.StreamHandler
    stream: ext://sys.stderr
  access:
    formatter: access
    class: logging.StreamHandler
    stream: ext://sys.stdout
loggers:
  gunicorn.error:
    level: INFO
    handlers:
      - gunicorn.error
      - gunicorn.error_file
    propagate: true
  gunicorn.access:
    level: INFO
    handlers:
      - gunicorn.access
      - gunicorn.access_file
    propagate: true

  generator:
    level: INFO
    handlers:
      - app_default
      - gen_file_handler
    propagate: no
  public:
    level: INFO
    handlers:
      - app_default
      - public_file_handler
    propagate: no
  admin:
    level: INFO
    handlers:
      - app_default
      - admin_file_handler
    propagate: no
  auth:
    level: INFO
    handlers:
      - app_default
      - auth_file_handler
    propagate: no

  uvicorn.error:
    level: INFO
    handlers:
      - default
      - file_handler
    propagate: no
  uvicorn.access:
    level: INFO
    handlers:
      - access
      - file_handler
    propagate: no
<html>
<head>
    <title>Login</title>
    <link href="{{ url_for('static', path='/styles.css') }}" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <form method="POST">
        <div class="mb-3">
          <label>Username</label>
          <input type="text" required placeholder="Your username" name="username" value="{{username}}" class="form-control">
        </div>
        <div class="mb-3">
          <label>Password</label>
          <input type="password" required placeholder="Password" value="{{password}}" name="password" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
      </form>
</body>
</html>
